name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the baseline the driver targets; 21 guards against regressions on a newer LTS.
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Integration tests need a Docker daemon for Testcontainers; ubuntu-latest ships one.
      - name: Check Docker is available
        run: docker version

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build javadoc and sources jars
        run: mvn --batch-mode --no-transfer-progress -Prelease -DskipTests package

  bundle:
    name: Bundle jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The shaded jar is what BI tools consume, so a broken shade config should fail here
      # rather than at release time.
      - name: Build the self-contained bundle jar
        run: mvn --batch-mode --no-transfer-progress -Pbundle -DskipTests package
